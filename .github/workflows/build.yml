name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            fonts-dejavu-core \
            libegl1 \
            libgl1 \
            libxkbcommon0 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libfontconfig1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0
      - name: Install the package
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest
      - name: UI smoke
        run: xvfb-run -a python scripts/ui_smoke.py tests/fixtures/white_text.pdf "$RUNNER_TEMP/ui-smoke"

  macos:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the disk image
        run: bash scripts/build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: InvisibleMarkCleaner-macos
          path: dist/InvisibleMarkCleaner.dmg

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the executable
        run: powershell -ExecutionPolicy Bypass -File scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: InvisibleMarkCleaner-windows
          path: dist/InvisibleMarkCleaner.exe
